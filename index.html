<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Army Mock Test 2027</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f3f5f7;color:#17202a}
header{background:#173b2d;color:#fff;padding:22px 16px;text-align:center}header h1{margin:0;font-size:28px}header p{margin:7px 0 0;opacity:.9}
.wrap{max-width:1000px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 14px #00000012;border:1px solid #e4e7ea}.card h3{margin:0 0 7px}.card p{color:#5f6b75}.btn{border:0;border-radius:9px;padding:11px 15px;background:#173b2d;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#e9edf0;color:#17202a}
.hidden{display:none}.topbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:15px}.timer{font-weight:800;background:#fff;padding:10px 14px;border-radius:9px}
.qbox{background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 14px #00000012}.tag{font-size:12px;font-weight:800;color:#7a2d00;background:#fff0e8;padding:4px 7px;border-radius:6px;display:inline-block;margin-bottom:10px}.qtext{font-size:19px;font-weight:700;line-height:1.45}.opt{display:block;border:1px solid #dce1e5;border-radius:10px;padding:12px;margin:9px 0;cursor:pointer}.opt:hover{background:#f6f8f9}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:15px}
.result{background:#fff;padding:24px;border-radius:14px;text-align:center;box-shadow:0 3px 14px #00000012}.score{font-size:40px;font-weight:900}.review{text-align:left;margin-top:18px}.review div{padding:10px;border-bottom:1px solid #eee}.correct{color:#147a3d}.wrong{color:#b3261e}.muted{color:#69757f}
@media(max-width:600px){header h1{font-size:23px}.qtext{font-size:17px}.wrap{padding:12px}}
</style></head>
<body>
<header><h1>🇮🇳 Army Mock Test 2027</h1><p>GD तैयारी • 10 Mock Tests • 50 प्रश्न • 60 मिनट</p></header>
<div class="wrap">
<section id="home">
<h2>Mock Tests</h2><p class="muted">हर टेस्ट में 15 GK + 15 Science + 15 Maths + 5 Reasoning हैं।</p>
<div id="cards" class="grid"></div>
</section>
<section id="quiz" class="hidden">
<div class="topbar"><button class="btn secondary" onclick="goHome()">← Tests</button><b id="title"></b><div class="timer" id="timer">60:00</div></div>
<div class="qbox"><div id="progress" class="muted"></div><div id="tag" class="tag"></div><div id="qtext" class="qtext"></div><div id="opts"></div>
<div class="nav"><button class="btn secondary" onclick="prevQ()">पिछला</button><button class="btn" onclick="nextQ()">अगला</button></div></div>
</section>
<section id="result" class="hidden"><div class="result"><h2 id="resultTitle"></h2><div class="score" id="score"></div><p id="stats"></p><button class="btn" onclick="goHome()">सभी टेस्ट</button><div id="review" class="review"></div></div></section>
</div>
<script>
let DATA, test, current=0, answers=[], left=3600, interval;
fetch('questions.json').then(r=>r.json()).then(d=>{DATA=d;renderCards()});
const $=id=>document.getElementById(id);
function renderCards(){ $('cards').innerHTML=DATA.tests.map(t=>`<div class="card"><h3>${t.title}</h3><p>50 प्रश्न • 60 मिनट<br>GK 15 • Science 15 • Maths 15 • Reasoning 5</p><button class="btn" onclick="start(${t.id})">Start Test</button></div>`).join('') }
function start(id){test=DATA.tests.find(x=>x.id===id);current=0;answers=Array(test.questions.length).fill(null);left=test.duration*60;$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');$('title').textContent=test.title;clearInterval(interval);interval=setInterval(()=>{left--;showTime();if(left<=0){clearInterval(interval);finish()}},1000);renderQ()}
function showTime(){let m=Math.floor(left/60),s=left%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function renderQ(){let q=test.questions[current];$('progress').textContent=`प्रश्न ${current+1} / ${test.questions.length}`;$('tag').textContent=q.tag;$('qtext').textContent=q.text;$('opts').innerHTML=q.options.map((o,i)=>`<label class="opt"><input type="radio" name="o" ${answers[current]===i?'checked':''} onchange="answers[current]=${i}"> ${String.fromCharCode(65+i)}. ${o}</label>`).join('');}
function nextQ(){if(current<test.questions.length-1){current++;renderQ()}else finish()}
function prevQ(){if(current>0){current--;renderQ()}}
function finish(){clearInterval(interval);let score=0;test.questions.forEach((q,i)=>{if(answers[i]===q.answer)score++});$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('resultTitle').textContent=test.title+' Result';$('score').textContent=score+' / '+test.questions.length;$('stats').textContent=`सही: ${score} • गलत: ${answers.filter((a,i)=>a!==null&&a!==test.questions[i].answer).length} • छोड़े: ${answers.filter(a=>a===null).length}`;$('review').innerHTML=test.questions.map((q,i)=>{let ok=answers[i]===q.answer;return `<div><b>${i+1}. ${q.text}</b><br><span class="${ok?'correct':'wrong'}">${answers[i]===null?'छोड़ा':ok?'सही':'गलत'}</span> • सही उत्तर: ${q.options[q.answer]}</div>`}).join('')}
function goHome(){clearInterval(interval);$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('home').classList.remove('hidden')}
</script></body></html>
