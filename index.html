<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Army 10 Mock Tests</title>
    <style>
        body { font-family: Arial, sans-serif; background: #eef2f3; padding: 15px; text-align: center; margin: 0; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 0 10px rgba(0,0,0,0.1); text-align: left; }
        h1, h2 { color: #d32f2f; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .test-btn { background: #1976d2; color: white; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; text-align: center; font-size: 15px; }
        .option { margin: 10px 0; display: block; background: #f0f0f0; padding: 12px; border-radius: 5px; cursor: pointer; }
        .nav-btn { background: #1976d2; color: white; border: none; padding: 12px; border-radius: 5px; width: 100%; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .submit-btn { background: #d32f2f; }
        .back-btn { background: #555; color: white; padding: 8px 12px; border: none; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
        .hide { display: none; }
        .result-box { text-align: center; font-size: 18px; line-height: 1.8; }
        .correct { color: #2e7d32; font-weight: bold; }
        .wrong { color: #c62828; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- Home Menu -->
    <div id="home-screen">
        <h1>🪖 इंडियन आर्मी टेस्ट पोर्टल</h1>
        <p style="text-align: center; color: #555;">अपना मॉक टेस्ट चुनें:</p>
        <div class="grid">
            <button class="test-btn" onclick="startTest(1)">मॉक टेस्ट 1</button>
            <button class="test-btn" onclick="startTest(2)">मॉक टेस्ट 2</button>
            <button class="test-btn" onclick="startTest(3)">मॉक टेस्ट 3</button>
            <button class="test-btn" onclick="startTest(4)">मॉक टेस्ट 4</button>
            <button class="test-btn" onclick="startTest(5)">मॉक टेस्ट 5</button>
            <button class="test-btn" onclick="startTest(6)">मॉक टेस्ट 6</button>
            <button class="test-btn" onclick="startTest(7)">मॉक टेस्ट 7</button>
            <button class="test-btn" onclick="startTest(8)">मॉक टेस्ट 8</button>
            <button class="test-btn" onclick="startTest(9)">मॉक टेस्ट 9</button>
            <button class="test-btn" onclick="startTest(10)">मॉक टेस्ट 10</button>
        </div>
    </div>

    <!-- Quiz Screen -->
    <div id="quiz-screen" class="hide">
        <button class="back-btn" onclick="goHome()">← मुख्य मेनू</button>
        <h2 id="test-title">मॉक टेस्ट</h2>
        <div id="quiz-box"></div>
        <button class="nav-btn" onclick="nextQuestion()">अगला प्रश्न</button>
        <button class="nav-btn submit-btn" onclick="submitQuiz()">सबमिट करें</button>
    </div>

    <!-- Result Screen -->
    <div id="result-screen" class="hide">
        <div class="result-box">
            <h3>🎉 परिणाम 🎉</h3>
            <div id="result-details"></div>
            <button class="nav-btn" onclick="goHome()">मुख्य मेनू पर लौटें</button>
        </div>
    </div>
</div>

<script>
    // 10 Mock Tests Data
    const allTests = {
        1: [
            { question: "प्र.1: भारत के प्रथम राष्ट्रपति कौन थे?", options: ["डॉ. राजेंद्र प्रसाद", "डॉ. सर्वपल्ली राधाकृष्णन", "पंडित नेहरू", "महात्मा गांधी"], correct: 0 },
            { question: "प्र.2: जल का रासायनिक सूत्र क्या है?", options: ["CO2", "H2O", "NaCl", "O2"], correct: 1 },
            { question: "प्र.3: 15 + 25 का मान क्या होगा?", options: ["30", "35", "40", "45"], correct: 2 },
            { question: "प्र.4: थल सेना दिवस कब मनाया जाता है?", options: ["15 जनवरी", "8 अक्टूबर", "4 दिसंबर", "26 जनवरी"], correct: 0 },
            { question: "प्र.5: विषम चुनें: (कागज, कलम, पेंसिल, कार)", options: ["कागज", "कलम", "पेंसिल", "कार"], correct: 3 }
        ],
        2: [
            { question: "प्र.1: भारत की राजधानी क्या है?", options: ["मुंबई", "नई दिल्ली", "कोलकाता", "चेन्नई"], correct: 1 },
            { question: "प्र.2: सूर्य के प्रकाश से कौन सा विटामिन मिलता है?", options: ["विटामिन A", "विटामिन B", "विटामिन C", "विटामिन D"], correct: 3 },
            { question: "प्र.3: 100 का वर्गमूल क्या है?", options: ["5", "10", "20", "50"], correct: 1 },
            { question: "प्र.4: राष्ट्रीय ध्वज में कितनी तीलियाँ होती हैं?", options: ["20", "24", "12", "30"], correct: 1 },
            { question: "प्र.5: 2, 4, 6, 8, ?", options: ["9", "10", "11", "12"], correct: 1 }
        ],
        3: [
            { question: "प्र.1: 'सत्यमेव जयते' कहाँ से लिया गया है?", options: ["ऋग्वेद", "मुंडकोपनिषद", "सामवेद", "रामायण"], correct: 1 },
            { question: "प्र.2: मनुष्य के शरीर में कितनी हड्डियाँ होती हैं?", options: ["206", "300", "208", "201"], correct: 0 },
            { question: "प्र.3: 50 का 10% कितना होगा?", options: ["5", "10", "15", "20"], correct: 0 },
            { question: "प्र.4: भारत का राष्ट्रीय खेल कौन सा है?", options: ["क्रिकेट", "हॉकी", "फुटबॉल", "कबड्डी"], correct: 1 },
            { question: "प्र.5: यदि BOY = 3, तो GIRL = ?", options: ["3", "4", "5", "6"], correct: 1 }
        ],
        4: [
            { question: "प्र.1: कारगिल युद्ध किस वर्ष हुआ था?", options: ["1965", "1971", "1999", "1962"], correct: 2 },
            { question: "प्र.2: ऑक्सीजन का प्रतीक क्या है?", options: ["H", "O", "N", "C"], correct: 1 },
            { question: "प्र.3: 12 × 12 कितना होता है?", options: ["124", "144", "136", "148"], correct: 1 },
            { question: "प्र.4: ताजमहल किस नदी के किनारे है?", options: ["गंगा", "यमुना", "सरयू", "नर्मदा"], correct: 1 },
            { question: "प्र.5: श्रृंखला: 5, 10, 15, 20, ?", options: ["22", "25", "30", "24"], correct: 1 }
        ],
        5: [
            { question: "प्र.1: भारत का सर्वोच्च वीरता पुरस्कार कौन सा है?", options: ["परमवीर चक्र", "अशोक चक्र", "महावीर चक्र", "वीर चक्र"], correct: 0 },
            { question: "प्र.2: सबसे कठोर पदार्थ कौन सा है?", options: ["सोना", "लोहा", "हीरा", "तांबा"], correct: 2 },
            { question: "प्र.3: 1 किलोमीटर में कितने मीटर होते हैं?", options: ["500", "1000", "100", "10000"], correct: 1 },
            { question: "प्र.4: 'करो या मरो' का नारा किसने दिया?", options: ["नेहरू", "गांधी जी", "भगत सिंह", "बोस"], correct: 1 },
            { question: "प्र.5: विषम चुनें: (सेब, आम, केला, आलू)", options: ["सेब", "आम", "केला", "आलू"], correct: 3 }
        ],
        6: [
            { question: "प्र.1: वायु सेना दिवस कब मनाया जाता है?", options: ["8 अक्टूबर", "15 जनवरी", "4 दिसंबर", "26 जनवरी"], correct: 0 },
            { question: "प्र.2: रक्त का लाल रंग किसके कारण होता है?", options: ["प्लाज्मा", "हीमोग्लोबिन", "WBC", "पानी"], correct: 1 },
            { question: "प्र.3: 100 / 4 का मान?", options: ["20", "25", "30", "15"], correct: 1 },
            { question: "प्र.4: भारत का राष्ट्रीय पशु कौन सा है?", options: ["शेर", "बाघ", "हाथी", "चीता"], correct: 1 },
            { question: "प्र.5: सूर्य : गर्मी :: बर्फ : ?", options: ["ठंड", "पानी", "भाप", "नदी"], correct: 0 }
        ],
        7: [
            { question: "प्र.1: नौसेना दिवस कब मनाया जाता है?", options: ["4 दिसंबर", "15 जनवरी", "8 अक्टूबर", "15 अगस्त"], correct: 0 },
            { question: "प्र.2: शुद्ध जल का pH मान कितना होता है?", options: ["5", "7", "8", "12"], correct: 1 },
            { question: "प्र.3: 5 का घन (Cube) क्या होगा?", options: ["25", "125", "625", "75"], correct: 1 },
            { question: "प्र.4: क्षेत्रफल में भारत का सबसे बड़ा राज्य?", options: ["यूपी", "राजस्थान", "महाराष्ट्र", "एमपी"], correct: 1 },
            { question: "प्र.5: 3, 6, 9, 12, ?", options: ["13", "14", "15", "16"], correct: 2 }
        ],
        8: [
            { question: "प्र.1: भारत के राष्ट्रगान के रचयिता कौन हैं?", options: ["बंकिमचंद्र", "रवींद्रनाथ टैगोर", "कबीर", "नेहरू"], correct: 1 },
            { question: "प्र.2: बल्ब का फिलामेंट किसका बना होता है?", options: ["तांबा", "टंगस्टन", "नाइक्रोम", "लोहा"], correct: 1 },
            { question: "प्र.3: 1 घंटे में कितने सेकंड होते हैं?", options: ["60", "3600", "600", "1200"], correct: 1 },
            { question: "प्र.4: रेड क्रॉस का मुख्यालय कहाँ है?", options: ["जेनेवा", "पेरिस", "लंदन", "न्यूयॉर्क"], correct: 0 },
            { question: "प्र.5: पूर्व का विपरीत दिशा क्या है?", options: ["उत्तर", "दक्षिण", "पश्चिम", "उत्तर-पूर्व"], correct: 2 }
        ],
        9: [
            { question: "प्र.1: सौर मंडल का सबसे बड़ा ग्रह कौन सा है?", options: ["मंगल", "बृहस्पति", "पृथ्वी", "शनि"], correct: 1 },
            { question: "प्र.2: विटामिन A की कमी से रोग?", options: ["रतौंधी", "बेरीबेरी", "स्कर्वी", "रिकेट्स"], correct: 0 },
            { question: "प्र.3: 2, 4, 6 का औसत क्या होगा?", options: ["3", "4", "5", "6"], correct: 1 },
            { question: "प्र.4: भारत का राष्ट्रीय फूल?", options: ["गुलाब", "कमल", "चमेली", "सूरजमुखी"], correct: 1 },
            { question: "प्र.5: 10, 20, 30, 40, ?", options: ["45", "50", "55", "60"], correct: 1 }
        ],
        10: [
            { question: "प्र.1: भारत की मुद्रा क्या है?", options: ["डॉलर", "रुपया", "टका", "येन"], correct: 1 },
            { question: "प्र.2: थर्मामीटर में किस धातु का प्रयोग होता है?", options: ["तांबा", "पारा", "लोहा", "एल्युमिनियम"], correct: 1 },
            { question: "प्र.3: 1/2 का प्रतिशत मान?", options: ["25%", "50%", "75%", "100%"], correct: 1 },
            { question: "प्र.4: भारत के प्रथम प्रधानमंत्री कौन थे?", options: ["पटेल", "नेहरू", "शास्त्री", "अम्बेडकर"], correct: 1 },
            { question: "प्र.5: त्रिभुज में कितनी भुजाएं होती हैं?", options: ["2", "3", "4", "5"], correct: 1 }
        ]
    };

    let currentTest = [];
    let currentQ = 0;
    let userAnswers = [];

    function startTest(testNum) {
        currentTest = allTests[testNum];
        currentQ = 0;
        userAnswers = new Array(currentTest.length).fill(null);
        
        document.getElementById('home-screen').classList.add('hide');
        document.getElementById('result-screen').classList.add('hide');
        document.getElementById('quiz-screen').classList.remove('hide');
        document.getElementById('test-title').innerText = "मॉक टेस्ट - " + testNum;
        
        loadQuestion();
    }

    function loadQuestion() {
        let qData = currentTest[currentQ];
        let html = `<p><strong>${qData.question}</strong></p>`;
        for(let i = 0; i < qData.options.length; i++) {
            let checked = userAnswers[currentQ] === i ? 'checked' : '';
            html += `<label class="option">
                <input type="radio" name="opt" value="${i}" ${checked}> ${qData.options[i]}
            </label>`;
        }
        document.getElementById('quiz-box').innerHTML = html;
    }

    function saveAnswer() {
        let selected = document.querySelector('input[name="opt"]:checked');
        if (selected) {
            userAnswers[currentQ] = parseInt(selected.value);
        }
    }

    function nextQuestion() {
        saveAnswer();
        if (currentQ < currentTest.length - 1) {
            currentQ++;
            loadQuestion();
        } else {
            submitQuiz();
        }
    }

    function submitQuiz() {
        saveAnswer();
        let correct = 0, wrong = 0, unattempted = 0;
        for (let i = 0; i < currentTest.length; i++) {
            if (userAnswers[i] === null) unattempted++;
            else if (userAnswers[i] === currentTest[i].correct) correct++;
            else wrong++;
        }

        document.getElementById('quiz-screen').classList.add('hide');
        document.getElementById('result-screen').classList.remove('hide');

        document.getElementById('result-details').innerHTML = `
            <p>कुल प्रश्न: <strong>${currentTest.length}</strong></p>
            <p class="correct">सही उत्तर: ${correct}</p>
            <p class="wrong">गलत उत्तर: ${wrong}</p>
            <p>बिना उत्तर दिए: <strong>${unattempted}</strong></p>
            <hr>
            <p><strong>कुल अंक: ${correct} / ${currentTest.length}</strong></p>
        `;
    }

    function goHome() {
        document.getElementById('quiz-screen').classList.add('hide');
        document.getElementById('result-screen').classList.add('hide');
        document.getElementById('home-screen').classList.remove('hide');
    }
</script>

</body>
</html>
