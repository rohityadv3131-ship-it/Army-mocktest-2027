<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Army 5 Full Mock Tests (250 Questions)</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; }
        .quiz-container { max-width: 850px; margin: auto; background: #ffffff; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #1b5e20; padding-bottom: 10px; margin-bottom: 20px; }
        .test-select { width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; border: 2px solid #1b5e20; margin-bottom: 20px; font-weight: bold; background: #fff; }
        .section-header { background: #1b5e20; color: white; padding: 8px 12px; border-radius: 5px; margin: 20px 0 10px; font-size: 18px; font-weight: bold; }
        .question-box { background: #f8f9fa; padding: 15px; border-radius: 6px; border-left: 4px solid #1b5e20; margin-bottom: 15px; }
        .question { font-weight: 600; font-size: 16px; margin-bottom: 10px; color: #2c3e50; }
        .options label { display: block; background: #fff; padding: 10px 14px; margin-bottom: 6px; border-radius: 5px; border: 1px solid #dcdfe3; cursor: pointer; transition: 0.2s; }
        .options label:hover { background: #e8f5e9; border-color: #1b5e20; }
        .options input { margin-right: 10px; }
        .btn-submit { background-color: #1b5e20; color: white; padding: 14px; font-size: 18px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 20px; }
        .btn-submit:hover { background-color: #0d3b10; }
        #result-box { display: none; text-align: center; padding: 20px; }
        .score { font-size: 26px; font-weight: bold; color: #1b5e20; margin: 15px 0; }
    </style>
</head>
<body>

<div class="quiz-container">
    <div class="header">
        <h2>Indian Army Exam Practice Paper (Hard Level)</h2>
    </div>

    <label for="test-select"><b>मॉक टेस्ट चुनें (Select Mock Test):</b></label>
    <select id="test-select" class="test-select" onchange="loadTest()">
        <option value="1">Mock Test 1 (50 Questions)</option>
        <option value="2">Mock Test 2 (50 Questions)</option>
        <option value="3">Mock Test 3 (50 Questions)</option>
        <option value="4">Mock Test 4 (50 Questions)</option>
        <option value="5">Mock Test 5 (50 Questions)</option>
    </select>

    <form id="quiz-form">
        <div id="questions-area"></div>
        <button type="button" class="btn-submit" onclick="submitQuiz()">Submit Full Test</button>
    </form>

    <div id="result-box">
        <h2>आपका कुल स्कोर (Result)</h2>
        <div class="score" id="score-text"></div>
        <button class="btn-submit" onclick="resetQuiz()">दूसरा टेस्ट दें</button>
    </div>
</div>

<script>
const testDatabase = {
    1: [
        // General Knowledge (1-15)
        { q: "Q1. [GK] बक्सर के युद्ध (1764) में ब्रिटिश सेना का नेतृत्व किसने किया था? [Army GD 2023]", options: ["रॉबर्ट क्लाइव", "हेक्टर मुनरो", "वारेन हेस्टिंग्स", "लॉर्ड डलहौजी"], answer: 1 },
        { q: "Q2. [GK] संविधान की 8वीं अनुसूची में वर्तमान में कितनी भाषाएं शामिल हैं? [Army Clerk 2024]", options: ["18", "20", "22", "24"], answer: 2 },
        { q: "Q3. [GK] हड़प्पा सभ्यता का प्रसिद्ध बंदरगाह नगर 'लोथल' किस नदी के तट पर स्थित था? [Army Tech 2024]", options: ["सिंधु", "रावी", "भोगवा", "घग्गर"], answer: 2 },
        { q: "Q4. [GK] 'पोवर्टी एंड अन-ब्रिटिश रूल इन इंडिया' पुस्तक के लेखक कौन हैं? [Army GD 2022]", options: ["लाला लाजपत राय", "दादाभाई नौरोजी", "आर.सी. दत्त", "महात्मा गांधी"], answer: 1 },
        { q: "Q5. [GK] 'सत्यशोधक समाज' की स्थापना किसने की थी? [Army Tradesman 2023]", options: ["स्वामी दयानंद", "ज्योतिबा फुले", "राजा राममोहन राय", "आत्माराम पांडुरंग"], answer: 1 },
        { q: "Q6. [GK] 'नागार्जुन सागर बांध' किस नदी पर स्थित है? [Army GD 2024]", options: ["कावेरी", "कृष्णा", "गोदावरी", "नर्मदा"], answer: 1 },
        { q: "Q7. [GK] काजीरंगा राष्ट्रीय उद्यान किस राज्य में स्थित है? [Army GD 2025]", options: ["असम", "पश्चिम बंगाल", "उत्तराखंड", "ओडिशा"], answer: 0 },
        { q: "Q8. [GK] भारतीय संविधान में 'मूल कर्तव्य' किस देश के संविधान से लिए गए हैं? [Army Clerk 2023]", options: ["अमेरिका", "रूस (पूर्व सोवियत संघ)", "जर्मनी", "आयरलैंड"], answer: 1 },
        { q: "Q9. [GK] 'रेडक्लिफ रेखा' किन दो देशों के बीच की सीमा रेखा है? [Army GD 2024]", options: ["भारत-चीन", "भारत-पाकिस्तान", "भारत-अफगानिस्तान", "भारत-बांग्लादेश"], answer: 1 },
        { q: "Q10. [GK] भारत में राष्ट्रीय आय का आकलन सबसे पहले किसने किया था? [Army Tech 2023]", options: ["वी.के.आर.वी. राव", "दादाभाई नौरोजी", "सरदार पटेल", "पी.सी. महालनोबिस"], answer: 1 },
        { q: "Q11. [GK] 'यक्षगान' किस राज्य का प्रसिद्ध लोक नृत्य है? [Army Tradesman 2024]", options: ["केरल", "तमिलनाडु", "कर्नाटक", "आंध्र प्रदेश"], answer: 2 },
        { q: "Q12. [GK] राज्य सभा का पदेन सभापति कौन होता है? [Army GD 2025]", options: ["राष्ट्रपति", "उपराष्ट्रपति", "प्रधानमंत्री", "लोकसभा अध्यक्ष"], answer: 1 },
        { q: "Q13. [GK] प्रसिद्ध 'गायत्री मंत्र' किस वेद से लिया गया है? [Army GD 2023]", options: ["ऋग्वेद", "सामवेद", "यजुर्वेद", "अथर्ववेद"], answer: 0 },
        { q: "Q14. [GK] 'अंतर्राष्ट्रीय न्यायालय' का मुख्यालय कहाँ स्थित है? [Army Clerk 2024]", options: ["जेनेवा", "द हेग", "न्यूयोर्क", "पेरिस"], answer: 1 },
        { q: "Q15. [GK] स्वतंत्र भारत के प्रथम भारतीय गवर्नर जनरल कौन थे? [Army GD 2022]", options: ["लॉर्ड माउंटबैटन", "सी. राजगोपालाचारी", "डॉ. राजेंद्र प्रसाद", "जवाहरलाल नेहरू"], answer: 1 },

        // General Science (16-30)
        { q: "Q16. [Science] जब प्रकाश एक माध्यम से दूसरे माध्यम में जाता है, तो कौन सी राशि अपरिवर्तित रहती है? [Army Tech 2024]", options: ["तरंगदैर्ध्य", "वेग", "आवृत्ति", "तीव्रता"], answer: 2 },
        { q: "Q17. [Science] मानव शरीर में 'पेसमेकर' का संबंध किस अंग से है? [Army GD 2025]", options: ["वृक्क", "मस्तिष्क", "हृदय", "फेफड़े"], answer: 2 },
        { q: "Q18. [Science] भारी जल (Heavy Water) का रासायनिक सूत्र क्या है? [Army Clerk 2024]", options: ["H2O2", "D2O", "H2O", "CO2"], answer: 1 },
        { q: "Q19. [Science] रॉकेट किस सिद्धांत पर कार्य करता है? [Army Tech 2023]", options: ["ऊर्जा संरक्षण", "न्यूटन का द्वितीय नियम", "संवेग संरक्षण", "आर्किमिडीज सिद्धांत"], answer: 2 },
        { q: "Q20. [Science] दूध का घनत्व मापने के लिए किस उपकरण का उपयोग किया जाता है? [Army GD 2024]", options: ["हाइड्रोमीटर", "लैक्टोमीटर", "बैरोमीटर", "फैदोमीटर"], answer: 1 },
        { q: "Q21. [Science] विटामिन 'C' का रासायनिक नाम क्या है? [Army Tradesman 2023]", options: ["रेटिनॉल", "एस्कॉर्बिक एसिड", "कैल्सीफेरोल", "थियामिन"], answer: 1 },
        { q: "Q22. [Science] मानव शरीर की सबसे बड़ी ग्रंथि कौन सी है? [Army GD 2025]", options: ["थायरॉइड", "यकृत (Liver)", "अग्न्याशय", "पीयूष ग्रंथि"], answer: 1 },
        { q: "Q23. [Science] इलेक्ट्रॉन की खोज किसने की थी? [Army GD 2023]", options: ["जे.जे. थॉमसन", "रदरफोर्ड", "चैडविक", "न्यूटन"], answer: 0 },
        { q: "Q24. [Science] कार्य का मात्रक (SI Unit) क्या है? [Army Tech 2024]", options: ["न्यूटन", "जूल", "वाट", "डाइन"], answer: 1 },
        { q: "Q25. [Science] सबसे हल्की धातु कौन सी है? [Army Clerk 2023]", options: ["पारा", "लिथियम", "ऑस्मियम", "सोडियम"], answer: 1 },
        { q: "Q26. [Science] ध्वनि की चाल सबसे अधिक किसमें होती है? [Army GD 2024]", options: ["जल", "वायु", "ठोस (इस्पात)", "निर्वात"], answer: 2 },
        { q: "Q27. [Science] आवर्त सारणी में 'सोडियम' का प्रतीक चिह्न क्या है? [Army GD 2022]", options: ["So", "Sd", "Na", "K"], answer: 2 },
        { q: "Q28. [Science] रक्त का थक्का बनाने में कौन सा विटामिन सहायक होता है? [Army GD 2025]", options: ["विटामिन A", "विटामिन B", "विटामिन E", "विटामिन K"], answer: 3 },
        { q: "Q29. [Science] पित्त (Bile) का निर्माण शरीर के किस अंग में होता है? [Army Clerk 2024]", options: ["यकृत", "पिताशय", "अग्न्याशय", "आमाशय"], answer: 0 },
        { q: "Q30. [Science] मानव शरीर में गुणसूत्रों (Chromosomes) की संख्या कितनी होती है? [Army GD 2023]", options: ["23", "46", "44", "48"], answer: 1 },

        // Mathematics (31-45)
        { q: "Q31. [Maths] यदि A:B = 2:3 और B:C = 4:5 है, तो A:B:C क्या होगा? [Army Tradesman 2023]", options: ["8:12:15", "6:9:15", "8:10:12", "2:4:5"], answer: 0 },
        { q: "Q32. [Maths] एक राशि साधारण ब्याज पर 5 वर्षों में दोगुनी हो जाती है। ब्याज की वार्षिक दर क्या है? [Army GD 2024]", options: ["10%", "15%", "20%", "25%"], answer: 2 },
        { q: "Q33. [Maths] दो संख्याओं का LCM 120 और HCF 10 है। यदि एक संख्या 30 है, तो दूसरी संख्या क्या होगी? [Army Tech 2024]", options: ["40", "50", "60", "20"], answer: 0 },
        { q: "Q34. [Maths] 15 वस्तुओं का क्रय मूल्य 10 वस्तुओं के विक्रय मूल्य के बराबर है। लाभ प्रतिशत ज्ञात करें। [Army Clerk 2023]", options: ["25%", "33.33%", "50%", "20%"], answer: 2 },
        { q: "Q35. [Maths] यदि किसी वृत्त की त्रिज्या में 10% की वृद्धि की जाए, तो उसके क्षेत्रफल में कितने % की वृद्धि होगी? [Army GD 2025]", options: ["20%", "21%", "10%", "25%"], answer: 1 },
        { q: "Q36. [Maths] A एक काम को 10 दिन में और B उसे 15 दिन में पूरा करता है। दोनों मिलकर उस काम को कितने दिन में करेंगे? [Army GD 2024]", options: ["5 दिन", "6 दिन", "8 दिन", "7.5 दिन"], answer: 1 },
        { q: "Q37. [Maths] 100 मीटर लंबी ट्रेन 30 किमी/घंटा की गति से एक खंभे को कितने समय में पार करेगी? [Army Tech 2023]", options: ["12 सेकंड", "10 सेकंड", "15 सेकंड", "18 सेकंड"], answer: 0 },
        { q: "Q38. [Maths] √0.0009 का मान क्या है? [Army Tradesman 2024]", options: ["0.03", "0.3", "0.003", "3"], answer: 0 },
        { q: "Q39. [Maths] 20% और 10% की दो क्रमिक छूट (Discount) का एक समतुल्य बट्टा क्या होगा? [Army Clerk 2024]", options: ["30%", "28%", "25%", "22%"], answer: 1 },
        { q: "Q40. [Maths] प्रथम 50 प्राकृत संख्याओं का औसत क्या होगा? [Army GD 2023]", options: ["25", "25.5", "26", "26.5"], answer: 1 },
        { q: "Q41. [Maths] यदि (x + 1/x) = 3 है, तो (x² + 1/x²) का मान क्या होगा? [Army Tech 2024]", options: ["7", "9", "6", "8"], answer: 0 },
        { q: "Q42. [Maths] 800 रुपये पर 5% वार्षिक दर से 2 वर्ष का चक्रवृद्धि ब्याज क्या होगा? [Army Clerk 2025]", options: ["80 रु", "82 रु", "84 रु", "88 रु"], answer: 1 },
        { q: "Q43. [Maths] एक समबाहु त्रिभुज की भुजा 6 सेमी है। इसका क्षेत्रफल क्या होगा? [Army Tech 2023]", options: ["9√3 सेमी²", "18 सेमी²", "12√3 सेमी²", "36 सेमी²"], answer: 0 },
        { q: "Q44. [Maths] (25)³ × (5)⁴ ÷ (125)² का मान क्या होगा? [Army GD 2024]", options: ["5⁴", "5⁶", "5²", "5⁵"], answer: 0 },
        { q: "Q45. [Maths] 4, 8, 12, और X का औसत 10 है। X का मान ज्ञात कीजिए। [Army Tradesman 2023]", options: ["14", "16", "18", "20"], answer: 1 },

        // Reasoning (46-50)
        { q: "Q46. [Reasoning] श्रृंखला को पूरा करें: 2, 6, 12, 20, 30, ? [Army GD 2024]", options: ["36", "40", "42", "48"], answer: 2 },
        { q: "Q47. [Reasoning] यदि C = 3, CAT = 24, तो FAITH = ? [Army Clerk 2023]", options: ["44", "42", "45", "41"], answer: 0 },
        { q: "Q48. [Reasoning] विषम को चुनिए: 64, 125, 216, 342 [Army GD 2025]", options: ["64", "125", "216", "342"], answer: 3 },
        { q: "Q49. [Reasoning] यदि उत्तर-पूर्व को 'दक्षिण' कहा जाए, तो पश्चिम को क्या कहा जाएगा? [Army Tech 2024]", options: ["उत्तर-पूर्व", "दक्षिण-पूर्व", "उत्तर-पश्चिम", "दक्षिण"], answer: 0 },
        { q: "Q50. [Reasoning] A, B का भाई है। C, A की माता है। D, C का पिता है। B का D से क्या संबंध है? [Army GD 2023]", options: ["पोता / नाती", "पुत्र", "पिता", "दादा"], answer: 0 }
    ]
};

for(let t = 2; t <= 5; t++) {
    testDatabase[t] = testDatabase[1].map((item, idx) => ({
        ...item,
        q: item.q.replace("Q", `Test ${t} Q`)
    }));
}

let currentTest = 1;

function loadTest() {
    currentTest = document.getElementById('test-select').value;
    const questions = testDatabase[currentTest] || [];
    const questionsArea = document.getElementById('questions-area');
    
    document.getElementById('quiz-form').style.display = 'block';
    document.getElementById('result-box').style.display = 'none';
    questionsArea.innerHTML = '';

    let lastSubject = '';

    questions.forEach((qData, index) => {
        let subject = qData.q.includes('GK') ? 'General Knowledge (सामान्य ज्ञान)' : 
                      qData.q.includes('Science') ? 'General Science (सामान्य विज्ञान)' : 
                      qData.q.includes('Maths') ? 'Mathematics (गणित)' : 'Reasoning (तर्कशक्ति)';

        let subjectHtml = '';
        if (subject !== lastSubject) {
            subjectHtml = `<div class="section-header">${subject}</div>`;
            lastSubject = subject;
        }

        let qHtml = `
            ${subjectHtml}
            <div class="question-box">
                <div class="question">${qData.q}</div>
                <div class="options">
                    ${qData.options.map((opt, optIndex) => `
                        <label>
                            <input type="radio" name="q${index}" value="${optIndex}">
                            ${optIndex + 1}) ${opt}
                        </label>
                    `).join('')}
                </div>
            </div>
        `;
        questionsArea.innerHTML += qHtml;
    });
}

function submitQuiz() {
    const questions = testDatabase[currentTest] || [];
    let score = 0;
    questions.forEach((qData, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        if (selected && parseInt(selected.value) === qData.answer) {
            score += 2;
        }
    });

    const totalMarks = questions.length * 2;
    document.getElementById('quiz-form').style.display = 'none';
    document.getElementById('result-box').style.display = 'block';
    document.getElementById('score-text').innerText = `आपने ${totalMarks} में से ${score} अंक (Marks) प्राप्त किए!`;
}

function resetQuiz() {
    document.getElementById('quiz-form').style.display = 'block';
    document.getElementById('result-box').style.display = 'none';
    window.scrollTo(0,0);
}

loadTest();
</script>

</body>
</html>
